services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: echoir
    ports:
      - "5432:5432"
    volumes:
      - echoir-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d echoir"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  echoir-postgres:
